<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="THAT'S IT. — Poems by Mukesh Parankusam.">
<title>Poems — THAT'S IT. | Mukesh Parankusam</title>
<link rel="icon" href="/assets/images/mukesh-favicon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="/poems.css">
</head>
<body>
<header class="poems-header">
  <div class="poems-nav">
    <a class="back-link" href="/"><i class="fa-solid fa-arrow-left"></i><span>BACK TO MUKESH PARANKUSAM</span></a>
    <div class="brand">THAT’S IT.</div>
  </div>
</header>

<main>
<section class="poems-hero">
  <div class="poems-hero-inner">
    <span class="eyebrow">THAT’S IT. · POEMS</span>
    <h1>Poems</h1>
    <p>Fifty poems about ordinary life, memory, love, time, and the things we carry quietly.</p>
  </div>
</section>

<section class="poems-library">
  <div class="library-top">
    <div>
      <span class="eyebrow">THE COLLECTION</span>
      <h2>50 Poems</h2>
    </div>
    <label class="search-box" aria-label="Search poems">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input id="poemSearch" type="search" placeholder="Search poems..." autocomplete="off">
    </label>
  </div>
  <div id="poemGrid" class="poem-grid"></div>
  <p id="noResults" class="no-results" hidden>No poems found.</p>
</section>
</main>

<div id="poemReader" class="reader" aria-hidden="true">
  <div class="reader-backdrop" data-close-reader></div>
  <article class="reader-panel">
    <button class="reader-close" type="button" aria-label="Close poem" data-close-reader><i class="fa-solid fa-xmark"></i></button>
    <div class="reader-number" id="readerNumber"></div>
    <h2 id="readerTitle"></h2>
    <div class="reader-rule"></div>
    <div class="reader-text" id="readerText"></div>
    <div class="reader-nav">
      <button id="prevPoem" type="button"><i class="fa-solid fa-arrow-left"></i><span>Previous</span></button>
      <button id="nextPoem" type="button"><span>Next</span><i class="fa-solid fa-arrow-right"></i></button>
    </div>
  </article>
</div>

<footer class="poems-footer">
  <div>THAT’S IT.</div>
  <p>© 2026 Mukesh Parankusam. All Rights Reserved.</p>
</footer>
<script src="/poems.js"></script>
</body>
</html>
